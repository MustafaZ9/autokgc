name: Kingshot Scraper & Redeemer

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  # Manual trigger with optional code input
  workflow_dispatch:
    inputs:
      code:
        description: 'Manual gift code to redeem (skip scraping)'
        required: false
        type: string
  # External API trigger (from Cloudflare Worker)
  repository_dispatch:
    types: [trigger-scraper]

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release

    - name: Sync player IDs from Google Sheet
      run: |
        curl -sL "https://docs.google.com/spreadsheets/d/1GS08T9-VhX-o2596s1-pAUZbMUMsY3U1HU-mZSgcP8c/gviz/tq?tqx=out:csv&gid=295962408" \
          | tr -d '"' > lod.csv
        echo "✅ Synced $(wc -l < lod.csv) player IDs from Google Sheet"

    - name: Run Scraper & Redeemer
      run: |
        # Check for manual code from workflow_dispatch or repository_dispatch
        MANUAL_CODE=""
        if [ -n "${{ github.event.inputs.code }}" ]; then
          MANUAL_CODE="${{ github.event.inputs.code }}"
        elif [ -n "${{ github.event.client_payload.code }}" ]; then
          MANUAL_CODE="${{ github.event.client_payload.code }}"
        fi

        if [ -n "$MANUAL_CODE" ]; then
          echo "📝 Manual code: $MANUAL_CODE"
          ./target/release/autokgc --code "$MANUAL_CODE"
        else
          echo "🔍 Auto mode: scrape + redeem"
          ./target/release/autokgc
        fi

    - name: Commit and Push state updates
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update known and redeemed codes state"
        file_pattern: "known_codes.txt redeemed_codes.txt config.json lod.csv"
        commit_user_name: "MustafaZ9"
        commit_user_email: "247871525+MustafaZ9@users.noreply.github.com"
        commit_author: "MustafaZ9 <247871525+MustafaZ9@users.noreply.github.com>"

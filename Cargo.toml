[package]
name = "autokgc"
version = "2.0.0"
edition = "2021"
description = "Kingshot Gift Code Scraper & Redeemer"
license = "GPL-3.0"

[[bin]]
name = "autokgc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
md-5 = "0.10"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
rand = "0.8"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
